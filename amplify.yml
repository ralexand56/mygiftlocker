# AWS Amplify Hosting build (monorepo). Each push to the connected branch:
#   1. deploys the backend in /amplify for that branch, writing apps/web/amplify_outputs.json
#   2. builds the Next.js site in apps/web against it
version: 1
applications:
  - appRoot: apps/web
    backend:
      phases:
        build:
          commands:
            - cd "$(git rev-parse --show-toplevel)"
            - corepack enable
            - pnpm install --frozen-lockfile
            - pnpm exec ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --outputs-out-dir apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - cd "$(git rev-parse --show-toplevel)"
            - corepack enable
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - .next/cache/**/*
